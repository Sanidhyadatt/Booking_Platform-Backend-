services:
  db:
    image: postgres:15-alpine
    container_name: booking-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: booking_platform
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d booking_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: booking-api
    restart: always
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/booking_platform?schema=public"
      JWT_SECRET: "super-secret-key-change-in-production"
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
